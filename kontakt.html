<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Kontakt</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="hauptnavigation">
        <ul class="nav-links">
            <li><a href="IM1_Ski/index.html" aria-current="page">Startseite</a></li>
            <li><a href="ueber-mich-impressum.html">Über mich & Impressum</a></li>
            <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
    </nav>

    <form action="#" method="POST">
        <div>
            <label for="name">Ihr Name</label>
            <input type="text" id="name" name="name" required autocomplete="name">
        </div>

        <div>
            <label for="email">Ihre E-Mail-Adresse</label>
            <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div>
            <label for="nachricht">Ihre Nachricht</label>
            <textarea id="nachricht.name" id="nachricht" name="nachricht" rows="4" required></textarea>
        </div>

        <button type="absenden">Nachricht absenden</button>
    </form>

</body>
</html>
